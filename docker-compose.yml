services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: featherlog
      POSTGRES_USER: featherlog
      POSTGRES_PASSWORD: featherlog
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U featherlog"]
      interval: 5s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/featherlog
      DB_USER: featherlog
      DB_PASSWORD: featherlog
      JWT_SECRET: ${JWT_SECRET:-local-compose-secret-change-me-0123456789}
    ports:
      - "8080:8080"

volumes:
  pgdata:
